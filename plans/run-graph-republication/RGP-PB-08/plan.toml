deviation_summary = "Historical plan reconstructed on 2026-10-18 from the retained implementation commit. Existing review-checks and migration acceptance record the executed checks; reconstruction does not claim a new gate run."

[[actions]]
operation = "patch"
patch_path = "patches/implementation.patch"
target_paths = ["tests/test_graph_publication.py", "tools/graph_publication/README.md", "tools/graph_publication/checks.py", "tools/graph_publication/prepare.py", "tools/graph_publication/publish.py", "tools/graph_publication/recover.py"]

[[handoff_targets]]
label = "Retained implementation diff"
source = "plan"
path = "patches/implementation.patch"
line = 1

[gate]
source_roots = ["tools/graph_publication"]
test_roots = ["tests/test_graph_publication.py"]

[[gate.steps]]
role = "typecheck"
working_directory = "."
argv = ["pyrefly", "check", "tools/graph_publication", "tests/test_graph_publication.py"]

[[gate.steps]]
role = "test"
working_directory = "."
argv = ["python3", "-m", "pytest", "-q", "tests/test_graph_publication.py"]

[[gate.steps]]
role = "documentation"
working_directory = "."
argv = ["ruff", "check", "--select", "D", "tools/graph_publication", "tests/test_graph_publication.py"]

[[gate.steps]]
role = "lint"
working_directory = "."
argv = ["ruff", "format", "--check", "tests/test_graph_publication.py", "tools/graph_publication/README.md", "tools/graph_publication/checks.py", "tools/graph_publication/prepare.py", "tools/graph_publication/publish.py", "tools/graph_publication/recover.py"]

