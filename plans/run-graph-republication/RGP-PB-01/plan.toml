schema_version = 1
contract_id = "run-graph-republication"
package_sha256 = "0260d2c8c72bd2a65f5138b1bb73efb43c191dcbbc210aefe70bce9e5961465e"
pair_block_id = "RGP-PB-01"
baseline_commit = "27fbcaf8446cbeb2e76d8fee5717c43ce38006f8"
change_summary = [
  "Pass the existing RunFetcher into promotion and call read() for saved run documents.",
  "Preserve the cause of a failed read and retain ordinary publication behavior.",
]
deviation_summary = "The shared RunFetcher was simplified in commit 27fbcaf8 before the promoter change in b1d5d9da. Existing storage tests cover hashing; one new promoter test covers delegation and failure."

[[actions]]
operation = "patch"
patch_path = "patches/document-reader.patch"
target_paths = ["src/viper/execution/_promotion.py", "tests/test_run_execution.py"]

[[handoff_targets]]
label = "Installed promoter change"
source = "plan"
path = "patches/document-reader.patch"
line = 1

[[handoff_targets]]
label = "Document reader"
source = "repository"
path = "src/viper/execution/_promotion.py"
line = 103

[[handoff_targets]]
label = "Reader and rejection tests"
source = "repository"
path = "tests/test_run_execution.py"
line = 2187

[gate]
source_roots = ["pyproject.toml", "pyrightconfig.json", "src/viper"]
test_roots = ["tests"]

[[gate.steps]]
role = "typecheck"
working_directory = "."
argv = ["pyright", "--pythonpath", "/Users/machina/Developer/ChatGPT/viper/.venv/bin/python", "src/viper/execution/_promotion.py", "tests/test_run_execution.py"]

[[gate.steps]]
role = "test"
working_directory = "."
argv = ["python3", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests/test_run_execution.py::test_promotion_document_reader_uses_fetcher", "tests/test_run_execution.py::test_cloud_promotion_stages_verified_neighboring_store", "tests/test_run_execution.py::test_explicit_cloud_promotion_preserves_local_run_mode[False]", "tests/test_storage.py::test_new_execution_checks_a_previously_read_local_file", "tests/test_storage.py::test_run_fetcher_checks_download_once_before_caching", "tests/test_storage.py::test_run_fetcher_shares_first_content_check_between_read_and_path", "tests/test_storage.py::test_local_publication_reuses_hashes_and_preserves_revision"]

[[gate.steps]]
role = "documentation"
working_directory = "."
argv = ["ruff", "check", "--config", "pyproject.toml", "--select", "D", "src/viper", "tests"]

[[gate.steps]]
role = "lint"
working_directory = "."
argv = ["ruff", "format", "--check", "--config", "pyproject.toml", "src/viper/execution/_promotion.py", "tests/test_run_execution.py"]

[[gate.steps]]
role = "lint"
working_directory = "."
argv = ["ruff", "check", "--config", "pyproject.toml", "src/viper/execution/_promotion.py", "tests/test_run_execution.py"]
