source = "repository"
path = "tests/test_run_execution.py"
line = 2188

[gate]
source_roots = ["pyproject.toml", "pyrightconfig.json", "src/viper"]
test_roots = ["tests"]

[[gate.steps]]
role = "typecheck"
working_directory = "."
argv = ["pyright", "--pythonpath", "/Users/machina/Developer/ChatGPT/viper/.venv/bin/python", "src/viper/execution/_promotion.py", "tests/test_run_execution.py"]

[[gate.steps]]
role = "test"
working_directory = "."
argv = ["python3", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests/test_run_execution.py", "tests/test_code_style.py", "-k", "promotion or python_imports_are_declared_at_module_scope or repository_has_no_inline_lint_suppressions"]

[[gate.steps]]
