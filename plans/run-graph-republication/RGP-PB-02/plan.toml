schema_version = 1
contract_id = "run-graph-republication"
package_sha256 = "78bf5f71a9f96c3c9370380a2a27fa6a36553691ff90921876ac8071db1a3541"
pair_block_id = "RGP-PB-02"
baseline_commit = "8ae163150f15613743d2a016c84bc42bfa0baa32"
change_summary = ["Retain the completed RGP-PB-02 implementation at 2bb68454e92ba04d16fbbb5d015224552ac6fc60."]
deviation_summary = "Historical plan reconstructed on 2026-10-18 from the retained implementation commit. Existing review-checks and migration acceptance record the executed checks; reconstruction does not claim a new gate run."

[[actions]]
operation = "patch"
patch_path = "patches/implementation.patch"
target_paths = ["src/viper/_source.py", "src/viper/execution/_promotion.py", "src/viper/storage.py", "tests/test_run_execution.py"]

[[handoff_targets]]
label = "Retained implementation diff"
source = "plan"
path = "patches/implementation.patch"
line = 1

[gate]
source_roots = ["src/viper"]
test_roots = ["tests"]

[[gate.steps]]
role = "typecheck"
working_directory = "."
argv = ["pyrefly", "check", "src/viper", "tests"]

[[gate.steps]]
role = "test"
working_directory = "."
argv = ["python3", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests/test_run_execution.py::test_promotion_discovers_mixed_cloud_ancestors", "tests/test_run_execution.py::test_promotion_rejects_missing_legacy_settings", "tests/test_run_execution.py::test_promotion_document_reader_uses_fetcher", "tests/test_run_execution.py::test_cloud_promotion_stages_verified_neighboring_store", "tests/test_run_execution.py::test_explicit_cloud_promotion_preserves_local_run_mode[False]"]

[[gate.steps]]
role = "documentation"
working_directory = "."
argv = ["ruff", "check", "--select", "D", "src/viper", "tests"]

[[gate.steps]]
role = "lint"
working_directory = "."
argv = ["ruff", "format", "--check", "src/viper/_source.py", "src/viper/execution/_promotion.py", "src/viper/storage.py", "tests/test_run_execution.py"]

[[gate.steps]]
role = "lint"
working_directory = "."
argv = ["ruff", "check", "src/viper/_source.py", "src/viper/execution/_promotion.py", "src/viper/storage.py", "tests/test_run_execution.py"]
