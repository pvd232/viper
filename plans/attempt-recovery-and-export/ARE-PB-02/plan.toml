  "format",
  "--check",
  "--config",
  "pyproject.toml",
  "src/viper/_verification/attempt.py",
  "src/viper/_verification/plan.py",
  "src/viper/_verification/storage.py",
  "src/viper/api.py",
  "src/viper/cli.py",
  "src/viper/execution/__init__.py",
  "src/viper/execution/_export.py",
  "src/viper/execution/errors.py",
