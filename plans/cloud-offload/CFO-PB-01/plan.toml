[[handoff_targets]]
label = "Generated identity diff"
source = "plan"
path = "diff/src/viper/_cloud.py.diff"
line = 1

[[handoff_targets]]
label = "Complete identity source"
source = "plan"
path = "replace/src/viper/_cloud.py"
line = 1

[[handoff_targets]]
label = "Observing tests"
source = "plan"
path = "add/tests/test_offload.py"
line = 1

[gate]
source_roots = ["src/viper"]
test_roots = ["tests"]

[[gate.steps]]
role = "typecheck"
working_directory = "."
argv = ["pyrefly","check","src/viper/_cloud.py","src/viper/storage.py","src/viper/_verification/storage.py","src/viper/execution/_promotion_journal.py","src/viper/execution/_promotion_compare.py","tests/test_offload.py","tests/conftest.py"]

[[gate.steps]]
role = "test"
working_directory = "."
argv = ["python","-m","pytest","-q","-p","no:cacheprovider","tests/test_offload.py"]

[[gate.steps]]
role = "schema"
working_directory = "."
argv = ["python","-c","from viper._cloud import SnapshotCopy, SnapshotInventory, SnapshotSources, LocalSource\nrecords = (SnapshotCopy, SnapshotInventory, SnapshotSources, LocalSource)\nmissing = [record.__name__ + '.' + name for record in records for name, field in record.model_fields.items() if not field.description]\nassert not missing, missing"]

[[gate.steps]]
role = "documentation"
working_directory = "."
argv = ["ruff","check","--select","D","src/viper","tests"]

[[gate.steps]]
role = "lint"
working_directory = "."
argv = ["ruff","format","--check","src/viper/_cloud.py","src/viper/storage.py","src/viper/_verification/storage.py","src/viper/execution/_promotion_journal.py","src/viper/execution/_promotion_compare.py","tests/test_offload.py","tests/conftest.py"]

[[gate.steps]]
role = "lint"
working_directory = "."
argv = ["ruff","check","src/viper/_cloud.py","src/viper/storage.py","src/viper/_verification/storage.py","src/viper/execution/_promotion_journal.py","src/viper/execution/_promotion_compare.py","tests/test_offload.py","tests/conftest.py"]

