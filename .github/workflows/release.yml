name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Failed release run that owns the validated distributions"
        required: true
        type: string
      release_tag:
        description: "Signed release tag whose distributions will be recovered"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify the signed release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_OBJECT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq '.verification.verified')" = "true"
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          python -m build
          python -m twine check dist/*
      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/viper-provenance
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Download candidate distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Verify TestPyPI files and installed package
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          for ATTEMPT in {1..12}; do
            if python tests/release_index.py \
              --index https://test.pypi.org \
              --project viper-provenance \
              --version "$VERSION" \
              --dist dist; then
              break
            fi
            test "$ATTEMPT" -lt 12
            sleep 10
          done
          python -m pip install dist/*.whl
          python -m pip uninstall --yes viper-provenance
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --no-deps \
            "viper-provenance==$VERSION"
          python -m pip install "pytest>=9,<10"
          python -I -c "from importlib import resources; import viper; assert resources.files(viper).joinpath('py.typed').is_file(); assert all(getattr(viper, name) for name in viper.__all__)"
          viper --json capabilities
          ACCEPTANCE_ROOT="$(mktemp -d)"
          cp -R tests examples pyproject.toml "$ACCEPTANCE_ROOT/"
          cd "$ACCEPTANCE_ROOT"
          python -m pytest tests/test_generated_project_acceptance.py -q

  publish-pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/viper-provenance
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  recover-verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Download the signed-tag distributions
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$RELEASE_TAG" = "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir dist
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name python-package-distributions \
            --dir dist
      - name: Verify TestPyPI and the installed package
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python tests/release_index.py \
            --index https://test.pypi.org \
            --project viper-provenance \
            --version "$VERSION" \
            --dist dist
          python -m pip install dist/*.whl "pytest>=9,<10"
          python -m pip uninstall --yes viper-provenance
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --no-deps \
            "viper-provenance==$VERSION"
          python -I -c "from importlib import resources; import viper; assert resources.files(viper).joinpath('py.typed').is_file(); assert all(getattr(viper, name) for name in viper.__all__)"
          viper --json capabilities
          ACCEPTANCE_ROOT="$(mktemp -d)"
          cp -R tests examples pyproject.toml "$ACCEPTANCE_ROOT/"
          cd "$ACCEPTANCE_ROOT"
          python -m pytest tests/test_generated_project_acceptance.py -q
      - name: Store the recovered distributions
        uses: actions/upload-artifact@v5
        with:
          name: recovered-python-package-distributions
          path: dist/

  recover-pypi:
    needs: recover-verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/viper-provenance
    permissions:
      id-token: write
    steps:
      - name: Download the recovered distributions
        uses: actions/download-artifact@v6
        with:
          name: recovered-python-package-distributions
          path: dist/
      - name: Publish recovered release to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
