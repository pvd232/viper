name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,release]"
      - name: Lint and type-check
        run: |
          ruff check src/viper tests
          ruff format --check src/viper tests
          pyright --pythonpath "$(command -v python)"
      - name: Run unit and contract tests
        run: python -m pytest tests -q -m "unit or contract"

  integration:
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run integration tests
        run: python -m pytest tests -q -m "integration and not live_cuda"

  minimum-pydantic:
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the oldest supported Pydantic release
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]" "pydantic==2.12.0"
      - name: Validate project-defined parameter subclasses
        run: python -m pytest tests/test_parameter_validation.py -q

  release-candidate:
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and release dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,release]"
      - name: Run generated-project acceptance
        run: python -m pytest tests -q -m release
      - name: Build and inspect distributions
        run: python -m build && python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -m pytest tests/test_public_api.py -q
          python -I -c "from viper import api; assert all(getattr(api, name) for name in api.__all__)"
          python -I -c "from viper.api import CapabilitiesRequest, get_capabilities; result = get_capabilities(CapabilitiesRequest()); assert 'run' in result.operations and 'init_project' in result.operations and 'RunSpec' in result.schemas"
          viper --json capabilities
          viper init --help
          viper status --help
          viper compare-runs --help

  compatibility:
    needs: fast
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - name: Install project and release dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,release]"
      - name: Run compatibility tests
        run: python -m pytest tests -q -m "unit or contract"
      - name: Build and inspect distributions
        run: python -m build && python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c "import viper; assert all(getattr(viper, name) for name in viper.__all__)"
          python -I -c "from importlib import resources; import viper; assert resources.files(viper).joinpath('py.typed').is_file()"
          python -I -c "import viper; import viper.api; import viper.parameters"
          viper --json capabilities
