name: PB stack validation revision
on:
  pull_request:
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'pvd232/viper' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'rgp/pb03-publication-20261017'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          cache: pip
      - name: Prepare checked revisions for each PairBlock
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp tools/prepare_rgpstack.py "$RUNNER_TEMP/prepare_rgpstack.py"
          python "$RUNNER_TEMP/prepare_rgpstack.py"
      - name: Retain revision results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: checked-stack-revisions
          retention-days: 3
          path: ${{ runner.temp }}/rgp-stack-results/
