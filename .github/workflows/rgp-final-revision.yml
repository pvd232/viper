name: PB-06 and PB-07 validation revision
on:
  pull_request:
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'pvd232/viper' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'rgp/pb06-comparison-20261017'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          cache: pip
      - name: Prepare the final checked revisions
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import ast, os, pathlib, subprocess
          source = subprocess.check_output(['git', 'show', '01d97ce061e38f4242163ed52b5a4c05d24f32f8:tools/prepare_rgpstack.py'], text=True)
          source = source.replace("BASE = '2bb68454e92ba04d16fbbb5d015224552ac6fc60'", "BASE = '97cadc32fd7c640a48942933ef24b5e6f052bd54'")
          source = source.replace("FIXED = 'c3ecfe262b6e88a2fccdb563e9b1f22ce552c4fc'", "FIXED = '8a8788fd5a19130c7501829c4387db43c0359aa5'")
          start = source.index('HEADS = [')
          end = source.index('\n]', start) + 2
          source = source[:start] + "HEADS = [('06', '293628b25f5fc313d85c8faf00772753d509c7a0'), ('07', 'f98b694fc938a13ea746a0c7a63fdc9f8883c6f7')]" + source[end:]
          source = source.replace("if source.count(old) != 1:\n        raise ValueError('MemoryHub head declaration changed')", "if source.count(old) != 1 and 'self.head: str = ' not in source:\n        raise ValueError('MemoryHub head declaration changed')")
          source = source.replace("changed = set(git('diff', '--name-only', head).decode().splitlines()) | set(notes)", "changed = set(paths) | set(touched) | set(notes)")
          source = source.replace("if block == '03' else head", "if block == '06' else head")
          insertion = '''    for name in ('src/viper/execution/_promotion_journal.py', 'src/viper/execution/_promotion_compare.py', 'tests/test_run_execution.py'):
                  path = ROOT / name
                  text = path.read_text()
                  if '_Copy' in text:
                      path.write_text(text.replace('_Copy', 'SnapshotCopy'))
                      touched.append(name)
              with (ROOT / note_path).open('a') as stream:
                  stream.write('\\nPB-06 makes the existing snapshot progress record available to the comparison module as SnapshotCopy. PB-07 carries this shared-name correction forward.\\n')
          '''
          source = source.replace("    python_paths = [p for p in touched if p.endswith('.py')]", insertion + "    python_paths = [p for p in touched if p.endswith('.py')]")
          compile(source, 'prepare_final_stack', 'exec')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prepare_final_stack.py'
          path.write_text(source)
          PY
          python "$RUNNER_TEMP/prepare_final_stack.py"
      - name: Retain checked source and test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: checked-final-revisions
          retention-days: 3
          path: ${{ runner.temp }}/rgp-stack-results/
