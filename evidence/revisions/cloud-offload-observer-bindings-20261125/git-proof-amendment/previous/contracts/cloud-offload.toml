schema_version = 1
contract_id = "cloud-offload"
title = "Cloud Offload"

[[requirements]]
id = "CFO-REQ-01"
claim = "An accepted exact-byte offload binding preserves its original LocalStageResultSnapshotRef and complete SnapshotFileRef inventory. The original inventory must reproduce the local snapshot commit. The source and destination inventories must contain exactly the same unique paths, and corresponding declared members must have equal byte counts and SHA-256 values. Reject changed identities, missing members, extra members, or duplicate paths before accepting the binding for later cloud-backed read or eviction checks."
depends_on = []
verifier_ids = ["CFO-VR-01"]

[[verifiers]]
id = "CFO-VR-01"
requirement_ids = ["CFO-REQ-01"]
acceptance_conditions = [
  "Matching declared inventories preserve the original snapshot reference, reproduce its commit, and establish a one-to-one correspondence of unique paths and file identities.",
  "Changed declared payload identities, missing or extra members, duplicate paths, and source and destination inventories changed together under an unchanged original snapshot reference are rejected before later read or eviction checks.",
]
success_case = { repository_id = "viper", path = "tests/test_offload.py", symbol = "test_offload_binding_preserves_original_snapshot_identity" }
rejection_cases = [
  { repository_id = "viper", path = "tests/test_offload.py", symbol = "test_offload_binding_rejects_changed_payload" },
  { repository_id = "viper", path = "tests/test_offload.py", symbol = "test_offload_binding_rejects_changed_snapshot_membership" },
]

[[pair_blocks]]
id = "CFO-PB-01"
requirement_ids = ["CFO-REQ-01"]
depends_on = []
repository_id = "viper"
requirement_contribution = "Validate exact-byte snapshot bindings while preserving existing reference formats."
completion_evidence = ["implementation_review"]



[[requirements]]
id = "CFO-REQ-02"
claim = "Persist each original SnapshotInventory independently of resident payloads. One store-owned registry is authoritative for immutable inventory links, current physical bindings, artifact preferences and coordinated access; per-operation journals are not a second binding or retention authority. Reconstruct a fully resident legacy snapshot inventory once and validate it with the existing shared inventory validator before allowing partial residency. A missing registration is distinct from malformed or conflicting metadata. Retiring a binding invalidates its location without granting authority to delete an external file."
depends_on = ["CFO-REQ-01"]
verifier_ids = ["CFO-VR-02"]


[[requirements]]
id = "CFO-REQ-03"
claim = "LocalArtifactStore owns ordinary verified file resolution and complete snapshot listing. Select an available verified registered original first, then a shared content-addressed payload beneath .viper/store; only an absent usable local payload requires download from existing verified backing. Fresh RunFetcher instances use the same registry, and current-workspace bindings for an unchanged original reference are consulted before legacy workspace paths. Resident resolution does not construct a cloud client or require cloud credentials. Managed payload downloads use existing streaming and atomic-installation code without a second persistent provider payload cache. Preserve serialized references and complete inventory during partial residency, including bundle-relative filenames. RunFetcher retains execution-scoped verification reuse while delegating ordinary persistent caching; bounded transfer staging stays separate. Original outputs are not copied merely to populate a cache."
depends_on = ["CFO-REQ-02"]
verifier_ids = ["CFO-VR-03", "CFO-VR-14"]


[[requirements]]
id = "CFO-REQ-04"
claim = "Keep storage.offload default false and independent of configured publication destinations. Each exact registered artifact version, including its full existing bundle membership, has one mutable override: inherit, keep or offload. Inherit uses the current global default; do not persist a second effective boolean. Explicit keep is recorded before resolution and succeeds only when every member has a verified local copy; failure retains the preference. A global keep default retains produced or accessed payloads without proactively restoring history. Retention changes do not alter reference bytes, publication identity or completed receipts."
depends_on = ["CFO-REQ-03"]
verifier_ids = ["CFO-VR-04"]


[[requirements]]
id = "CFO-REQ-05"
claim = "Derive persistent subscribers from one registered artifact version and its existing member relationships, never from reads or workflow counts. A shared payload can lose its last usable local copy only when every subscriber currently permits offload. Keep preserves one verified local copy, not redundant materializations. Native workflow ownership protects admitted queued inputs before their consumers start and protects produced or accessed payloads through all admitted later consumers, including gaps between child calls. Acquire shared payload protection before physical resolution; process-held locks release on process exit. Coordinate current preferences, reader acquisition and final removal so a new keep or reader defeats stale cleanup. Do not add a per-read user-facing hold/release API."
depends_on = ["CFO-REQ-03","CFO-REQ-04"]
verifier_ids = ["CFO-VR-05","CFO-VR-12"]


[[requirements]]
id = "CFO-REQ-06"
claim = "Register and resolve managed copies consistently across datasets, outputs, reused producer artifacts and restorations. Origin alone never authorizes or permanently prohibits removal. Integrate capture_external_input and subsequent reads with managed resolution before removing an enrolled original input path. A changed existing external dataset creates a new version. User-owned exports require deliberate enrollment for automatic removal. One explicitly admitted outer workflow owns authoring, training, inference, evaluation, diagnostics, batches, benchmark confirmation and final verification; nested actions borrow its lifetime and cannot close it. Forward ownership explicitly across executor and worker boundaries without changing immutable scientific records. Account for returned batch failures as well as exceptions before declaring success. Preserve independent benchmark computation and per-execution verification. Separate undeclared Python calls are not inferred to be one workflow; do not add future-use prediction, timers or implicit interpreter-wide ownership. Existing calls remain unchanged inside the registered top-level driver."
depends_on = ["CFO-REQ-03","CFO-REQ-05"]
verifier_ids = ["CFO-VR-06", "CFO-VR-15"]


[[requirements]]
id = "CFO-REQ-07"
claim = "Publish completed originals directly after writers relinquish further writes, without mandatory payload copying or graph-rewriting promotion for new managed runs. Establish immutable identities, durable source registration and durable work admission before reporting acceptance; admission failure surfaces immediately. Native managed authoring and execution enqueue plan, pointer, stage, attempt, terminal and benchmark publication without foreground provider I/O. Queue publication independently of storage.offload. Existing journals and providers perform transfer, remote verification, receipts and retry in an independently surviving worker, using the actual JEP durable-admission pattern. Requests bind original inventories and pinned destinations; source paths and retention remain registry-owned and outside operation identity. Durable pending work protects required sources between attempts and across process exit, in addition to reader protection while streaming. Failed launch after admission and failed publication remain recoverable without repeating computation. Source bytes and their host remain until verified publication or verified durable handoff. Do not wrap work in a caller-owned executor that joins transfers on exit."
depends_on = ["CFO-REQ-02","CFO-REQ-03"]
verifier_ids = ["CFO-VR-07","CFO-VR-11"]


[[requirements]]
id = "CFO-REQ-08"
claim = "Successful outer-workflow closure durably requests cleanup and returns without waiting for publication or deletion. Offload is permission to remove, not an obligation at every child return. Cleanup uses the same durable work mechanism, without a separate retention queue or head-of-line blocking of ready uploads. At actual removal the worker requires successful whole-workflow closure, closed collection, verified required objects and final receipts at every admitted destination, recoverable backing, current unanimous permission, no remaining readers or admitted consumers, and an exact owned physical binding. Queue identities for reconsideration rather than an irrevocable delete command or cached allowed boolean. Recheck policy and exact file under reader exclusion and a short registry transaction, with no network I/O under that transaction. Busy readers, keep or pending proof defer removal without blocking the runner or failing successful publication. Reuse committed proof on later cleanup without repeating upload or full remote verification. Route legacy and recursive managed deletion through this decision; disposable scratch stays separate. Preserve replacements, user-owned names and sources after failed or unresolved publication or computation."
depends_on = ["CFO-REQ-05","CFO-REQ-06","CFO-REQ-07"]
verifier_ids = ["CFO-VR-08"]


[[requirements]]
id = "CFO-REQ-09"
claim = "Retain immutable inventories, bindings, preferences and recovery evidence after eviction. Resume publication without rerunning computation, reuse completed verified backing without reopening publication or changing its receipt, and restore unchanged original references into the current host store without recreating old absolute directories. Native queued execution reports locally verified scientific results separately from durable pending, complete or failed publication, with one status and wait/check path for observing deferred failures. A queued job is not a verified cloud reference. Existing APIs promising completed cloud publication continue waiting and surfacing failure. Explicit keep continues waiting for complete verified local materialization; a cold path request waits for usable verified bytes. Keep immutable run-record bytes unchanged when publication state advances. Remote verification may read remote bytes; background execution does not claim to remove transfer or verification costs."
depends_on = ["CFO-REQ-03","CFO-REQ-07"]
verifier_ids = ["CFO-VR-09"]


[[requirements]]
id = "CFO-REQ-10"
claim = "Retain one inventory validator, one ordinary resolver, one retention authority and one deletion-eligibility decision. Retire duplicate ordinary verified-object cache ownership and the pending per-operation source-binding registry as their successors land; retain bounded transfer staging and legacy explicit promotion behavior. Move JEP callers to the native mechanism before removing duplicated publication and retention machinery. Final acceptance includes an explicit before/after maintained source-and-test line report for Viper and JEP separately and combined; satisfy net reduction without dropping guarantees, meaningful checks or semantic documentation. Do not claim this requirement complete from planning or static proposals."
depends_on = ["CFO-REQ-08","CFO-REQ-09"]
verifier_ids = ["CFO-VR-10","CFO-VR-13"]

