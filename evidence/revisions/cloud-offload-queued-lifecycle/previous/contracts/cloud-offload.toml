schema_version = 1
contract_id = "cloud-offload"
title = "Cloud Offload"

[[requirements]]
id = "CFO-REQ-01"
claim = "An accepted exact-byte offload binding preserves its original LocalStageResultSnapshotRef and complete SnapshotFileRef inventory. The original inventory must reproduce the local snapshot commit. The source and destination inventories must contain exactly the same unique paths, and corresponding declared members must have equal byte counts and SHA-256 values. Reject changed identities, missing members, extra members, or duplicate paths before accepting the binding for later cloud-backed read or eviction checks."
depends_on = []
verifier_ids = ["CFO-VR-01"]

[[verifiers]]
id = "CFO-VR-01"
requirement_ids = ["CFO-REQ-01"]
acceptance_conditions = [
  "Matching declared inventories preserve the original snapshot reference, reproduce its commit, and establish a one-to-one correspondence of unique paths and file identities.",
  "Changed declared payload identities, missing or extra members, duplicate paths, and source and destination inventories changed together under an unchanged original snapshot reference are rejected before later read or eviction checks.",
]
success_case = { repository_id = "viper", path = "tests/test_offload.py", symbol = "test_offload_binding_preserves_original_snapshot_identity" }
rejection_cases = [
  { repository_id = "viper", path = "tests/test_offload.py", symbol = "test_offload_binding_rejects_changed_payload" },
  { repository_id = "viper", path = "tests/test_offload.py", symbol = "test_offload_binding_rejects_changed_snapshot_membership" },
]

[[pair_blocks]]
id = "CFO-PB-01"
requirement_ids = ["CFO-REQ-01"]
depends_on = []
repository_id = "viper"
requirement_contribution = "Validate exact-byte snapshot bindings while preserving existing reference formats."
completion_evidence = ["implementation_review"]



[[requirements]]
id = "CFO-REQ-02"
claim = "Persist each original SnapshotInventory independently of resident payloads. One store-owned registry is authoritative for immutable inventory links, current physical bindings, artifact preferences and coordinated access; per-operation journals are not a second binding or retention authority. Reconstruct a fully resident legacy snapshot inventory once and validate it with the existing shared inventory validator before allowing partial residency. A missing registration is distinct from malformed or conflicting metadata. Retiring a binding invalidates its location without granting authority to delete an external file."
depends_on = ["CFO-REQ-01"]
verifier_ids = ["CFO-VR-02"]


[[requirements]]
id = "CFO-REQ-03"
claim = "LocalArtifactStore owns ordinary verified file resolution and complete snapshot listing. Resolve through a registered original, a shared content-addressed payload beneath .viper/store, or existing verified cloud backing; verify size and SHA-256 before atomically installing a download. Preserve serialized references and complete inventory during partial residency. Retain usable bundle-relative filenames through the existing materialization mechanism. RunFetcher delegates ordinary persistent payload caching and may retain execution-scoped verification reuse; bounded task-owned transfer staging stays separate. Original outputs are not copied merely to populate a cache."
depends_on = ["CFO-REQ-02"]
verifier_ids = ["CFO-VR-03"]


[[requirements]]
id = "CFO-REQ-04"
claim = "Keep storage.offload default false and independent of configured publication destinations. Each exact registered artifact version, including its full existing bundle membership, has one mutable override: inherit, keep or offload. Inherit uses the current global default; do not persist a second effective boolean. Explicit keep is recorded before resolution and succeeds only when every member has a verified local copy; failure retains the preference. A global keep default retains produced or accessed payloads without proactively restoring history. Retention changes do not alter reference bytes, publication identity or completed receipts."
depends_on = ["CFO-REQ-03"]
verifier_ids = ["CFO-VR-04"]


[[requirements]]
id = "CFO-REQ-05"
claim = "Derive persistent subscribers from one registered artifact version and its existing member relationships, never from reads or workflow counts. A shared payload can lose its last usable local copy only when every subscriber currently permits offload. A keep preference preserves one verified local copy, not all redundant materializations. Native consumers acquire shared payload protection before resolution and retain it through tracked workflow completion; process-held locks release on process exit. Coordinate current preferences, reader acquisition and the final removal decision so a new keep or reader defeats stale cleanup. Do not add an unsupported raw-path hold/release API."
depends_on = ["CFO-REQ-03","CFO-REQ-04"]
verifier_ids = ["CFO-VR-05","CFO-VR-12"]


[[requirements]]
id = "CFO-REQ-06"
claim = "Register and resolve managed copies consistently across datasets, new outputs, reused producer artifacts and restorations. Origin alone never authorizes or permanently prohibits removal. Integrate capture_external_input and subsequent reads with managed resolution before removing an enrolled original input path. An existing changed external dataset produces a new captured version rather than silently reading an older binding. User-owned exports remain outside automatic deletion until deliberately enrolled. Borrow one internal lifetime across native training, inference, evaluation, diagnostics, batches and benchmark confirmation, and close after all managed users and writers finish."
depends_on = ["CFO-REQ-03","CFO-REQ-05"]
verifier_ids = ["CFO-VR-06"]


[[requirements]]
id = "CFO-REQ-07"
claim = "Publish completed original paths directly after writers finish and relinquish further writes, without mandatory payload copying or graph-rewriting promotion for new managed runs. Persist publication work before returning from admission and execute provider I/O independently of computation. Requests bind original inventory identities and pinned destinations; source paths are looked up in the shared registry and current retention is excluded from publication identity. Reuse existing provider verification and PublicationJournal recovery; adapt the actual JEP durable-admission pattern rather than claiming an existing native supervisor. Pending or failed work retains its sources; source bytes and their host remain available until verified publication or verified durable handoff."
depends_on = ["CFO-REQ-02","CFO-REQ-03"]
verifier_ids = ["CFO-VR-07","CFO-VR-11"]


[[requirements]]
id = "CFO-REQ-08"
claim = "Automatically remove managed payloads only after successful whole-workflow completion, closed publication collection, verified coverage and final receipts at every requested destination, current unanimous offload permission, no active readers, recoverable backing and an exact match to the authorized owned materialization. Use the same decision for legacy eviction and ancestor-directory deletion containing managed payloads. Keep ordinary disposable scratch cleanup independent. Recheck current policy and physical identity immediately before removal, preserve replacements and user-owned names, and retain local sources after failed or unresolved publication or computation."
depends_on = ["CFO-REQ-05","CFO-REQ-06","CFO-REQ-07"]
verifier_ids = ["CFO-VR-08"]


[[requirements]]
id = "CFO-REQ-09"
claim = "Keep immutable inventories, mutable bindings and preferences, and publication recovery evidence after payload eviction. Restart incomplete publication without rerunning computation, reuse committed verified backing without reopening publication or mutating its receipt, and restore evicted original local references through the ordinary resolver into the current host's store. A portable receipt does not require recreating the producing host's absolute paths. Scientific results and pending, complete or failed publication remain distinguishable. Existing APIs promising verified cloud references wait for verification and surface failure rather than report incomplete work as completed."
depends_on = ["CFO-REQ-03","CFO-REQ-07"]
verifier_ids = ["CFO-VR-09"]


[[requirements]]
id = "CFO-REQ-10"
claim = "Retain one inventory validator, one ordinary resolver, one retention authority and one deletion-eligibility decision. Retire duplicate ordinary verified-object cache ownership and the pending per-operation source-binding registry as their successors land; retain bounded transfer staging and legacy explicit promotion behavior. Move JEP callers to the native mechanism before removing duplicated publication and retention machinery. Final acceptance includes an explicit before/after maintained source-and-test line report for Viper and JEP separately and combined; satisfy net reduction without dropping guarantees, meaningful checks or semantic documentation. Do not claim this requirement complete from planning or static proposals."
depends_on = ["CFO-REQ-08","CFO-REQ-09"]
verifier_ids = ["CFO-VR-10","CFO-VR-13"]

