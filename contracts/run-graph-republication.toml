schema_version = 1
contract_id = "run-graph-republication"
title = "Run Graph Republication"

[[requirements]]
id = "RGP-REQ-01"
claim = "The promoter must read identified protocol documents through its supplied RunFetcher.read(). RunFetcher.path() supplies file paths for payloads. One RunFetcher must check pre-existing artifacts once per execution and reuse hashes for files published during that execution. Local, GCS, and Hugging Face reads must enforce the recorded byte count and SHA-256. Every ordinary retrieval or verification exception must become RunPromotionError(\"source run graph is unavailable\") with the original exception as its cause. RGP-PB-01 retains the public local-root restriction and existing publication behavior."
depends_on = []
verifier_ids = ["RGP-VR-01"]

[[requirements]]
id = "RGP-REQ-02"
claim = "RunPromotionPolicy.hosts names the destination cloud repositories for additional graph publications. Original files, references, workspace settings, and canonical SOTA pointers remain unchanged. Source readers resolve provider-specific addresses directly and obtain older viper_cloud addresses from the original workspace configuration. Missing source settings fail before publication. Transfer budgets belong to the transfer operation."
depends_on = ["RGP-REQ-01"]
verifier_ids = ["RGP-VR-02"]

[[requirements]]
id = "RGP-REQ-03"
claim = "Discovery follows typed documents across local, GCS, Hugging Face, and pinned Git storage. It lists every member of the required snapshots before transferring artifacts, checks a separately frozen required-file inventory, rejects conflicting identities and dependency cycles, and records pending hashes for additional local files. Shared ancestors keep every source relationship. HF documents that refer to GCS files remain part of the discovered graph."
depends_on = ["RGP-REQ-02"]
verifier_ids = ["RGP-VR-03"]

[[requirements]]
id = "RGP-REQ-04"
claim = "Publication must keep every scientific payload byte-identical and rewrite only identified protocol references and the metadata identities derived from those changes. Preserve stage identities, code commits, parameters, input roles, measurements, and provenance relationships. Update run-plan stage hashes, reuse keys, source-closure links, and cloud-stage references together. Key graph mappings by complete source identity; shared payload hashes must never collapse distinct producing histories. Preserve sealed snapshot membership and reject inconsistent identities."
depends_on = ["RGP-REQ-03"]
verifier_ids = ["RGP-VR-04"]

[[requirements]]
id = "RGP-REQ-05"
claim = "Before remote publication, persist an intent bound to the source snapshot, destination, policy digest, expected rewritten manifest, and dependency bindings. Recover the exact verified destination commit after interruption, including a lost response after a successful commit. Publish the completed binding atomically only after verifying that commit. Reuse completed bindings across selected roots and process restarts. Serialize writers for the same publication journal; reject mismatched or corrupt state. Reconcile an uncertain remote outcome before retrying and fail closed when its identity cannot be established. Retain completed children when a parent fails."
depends_on = ["RGP-REQ-04"]
verifier_ids = ["RGP-VR-05"]

[[requirements]]
id = "RGP-REQ-06"
claim = "Preflight must measure selected snapshots and available staging capacity before payload verification or transfer. Path-backed payload reads, source verification, publication, and destination verification must obey explicit staging, cache, and connection limits. Count VIPER, Hugging Face, and Xet caches and cross-filesystem copies. Persist verified destination bindings before reclaiming task-owned staged files. A snapshot that cannot fit the declared budget must fail before transfer; all unmodified source bytes and shared caches remain intact. Retry and cancellation must leave recoverable evidence and bounded temporary storage."
depends_on = ["RGP-REQ-05"]
verifier_ids = ["RGP-VR-06"]

[[requirements]]
id = "RGP-REQ-07"
claim = "A verifier independent of the rewriting traversal must compare the source and destination graphs using the saved mapping and the frozen inventory. Require exact scientific payload hashes, exact required inventory membership, preserved non-location fields, and an explicit field-level allowlist of derived metadata changes. Every original dependency edge must reach its intended mapped destination object. Reject missing, extra, altered, or substituted required objects even when the destination graph passes ordinary verification. Record the source roots, destination roots, inventory digest, policy digest, mapping digest, and comparison result."
depends_on = ["RGP-REQ-04", "RGP-REQ-06"]
verifier_ids = ["RGP-VR-07"]

[[requirements]]
id = "RGP-REQ-08"
claim = "Acceptance must run ordinary VIPER readers and model loading in a new process and fresh workspace with empty VIPER, Hugging Face, and Xet caches, no source store mounts, and original Mantra storage blocked. Allow only declared pinned external source repositories and the destination. Restore each selected model and run one frozen inference fixture under its recorded environment; compare against a retained expected result with a predeclared exact or numerical comparison rule. Persist inference output before downstream reporting so reporting repair reuses the measurement. Retain existing training and evaluation evidence without rerunning those experiments."
depends_on = ["RGP-REQ-07"]
verifier_ids = ["RGP-VR-08"]

[[requirements]]
id = "RGP-REQ-09"
claim = "Before bulk migration, a small mixed local/GCS/Hugging Face graph with two roots, a shared ancestor, distinct histories sharing payload bytes, and a reuse receipt must pass discovery, publication, restart recovery, independent comparison, and cold model recovery. Interrupt after a remotely committed child before its local acknowledgement and verify restart reuses that exact child. Record actual memory, disk, and connection observations. Preserve ordinary promotion tests and reject early public cloud-root enablement until the complete path passes."
depends_on = ["RGP-REQ-08"]
verifier_ids = ["RGP-VR-09"]

[[requirements]]
id = "RGP-REQ-10"
claim = "Publish the frozen MIL and Hopfield roots to an additional host, preserve source-to-destination mappings and the required-file inventory, and register the accepted publication atomically after all four models pass isolated recovery and frozen inference. Preserve original GCS publications, canonical model pointers, and default storage configuration."
depends_on = ["RGP-REQ-09"]
verifier_ids = ["RGP-VR-10"]

[[requirements]]
id = "RGP-REQ-11"
claim = "Reuse the journal-prepared SnapshotFileRef tuple and RevisionManifest when publishing unchanged staged inputs through the existing provider.publish_revision() path. Hash each upload input once in VIPER per publication attempt; preserve first-use checks, root confinement, intent-before-upload, exact-commit recovery, and destination byte readback before completion. Each HF journal check and graph-comparison snapshot check reads its complete manifest once, retaining complete owner/workspace/revision/files equality and generic-provider inventory checks."
depends_on = ["RGP-REQ-05", "RGP-REQ-07"]
verifier_ids = ["RGP-VR-11"]

[[requirements]]
id = "RGP-REQ-12"
claim = "Compute staging and nested-cache usage in one filesystem traversal per TransferSpace.check(). Preserve independent inode sets and symlink-confinement boundaries for both budgets, temporary-file accounting, peak observations, early reservation failures, and task-owned cleanup. Compare identical trees and report traversal counts and measured duration separately."
depends_on = ["RGP-REQ-06", "RGP-REQ-11"]
verifier_ids = ["RGP-VR-12"]

[[requirements]]
id = "RGP-REQ-13"
claim = "Within one RICO preparation or registration invocation, read each recovery request and model pointer once where its parsed value and digest are reused. Derive both from the same bytes. Preserve exact saved addresses, full journal membership, per-invocation pointer/request/prediction integrity checks, all-four-model coverage, and saved inference reuse."
depends_on = ["RGP-REQ-10"]
verifier_ids = ["RGP-VR-13"]

[[verifiers]]
id = "RGP-VR-01"
requirement_ids = ["RGP-REQ-01"]
acceptance_conditions = ["The promoter calls the supplied fetcher's read() method and returns its bytes.", "A failed document read raises the exact public message and preserves the original cause.", "The fetcher rejects altered content and checks pre-existing artifacts again in a new execution.", "Ordinary local promotion and staging from neighboring stores retain their existing behavior."]
success_case = { repository_id = "viper", path = "tests/test_run_execution.py", symbol = "test_promotion_document_reader_uses_fetcher" }
rejection_cases = [{ repository_id = "viper", path = "tests/test_run_execution.py", symbol = "test_promotion_document_reader_uses_fetcher" }, { repository_id = "viper", path = "tests/test_storage.py", symbol = "test_new_execution_checks_a_previously_read_local_file" }, { repository_id = "viper", path = "tests/test_storage.py", symbol = "test_run_fetcher_checks_download_once_before_caching" }]

