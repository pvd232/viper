requirement_ids = ["RGP-REQ-04"]
acceptance_conditions = ["Two producers with identical payloads retain distinct mapped records and consumer edges.", "RunPromotionError contains \"conflicting source identity\" for two identities asserted for the same source object.", "An independently valid substitute ancestor is rejected with \"graph relationship changed\"."]
success_case = { repository_id = "viper", path = "tests/test_run_execution.py", symbol = "test_republication_preserves_files_and_follows_new_references" }
