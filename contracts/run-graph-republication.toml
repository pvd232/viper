acceptance_conditions = ["Measured peak staging bytes, cache bytes, and concurrent connections stay within the supplied policy.", "RunPromotionError contains \"staging budget is insufficient\" before a payload download when the snapshot cannot fit.", "Injected transfer failure releases only task-owned disposable files and retains the journal and verified destination bindings."]
success_case = { repository_id = "viper", path = "tests/test_run_execution.py", symbol = "test_republication_obeys_resource_limits" }
